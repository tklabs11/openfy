name: Verificações
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    # Ubuntu 22.04 tem o rpmbuild compatível com o fpm usado no empacotamento.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Valida o empacotamento Linux (AppImage, deb, rpm, tar.gz) antes do release.
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run dist:linux -- --publish never
