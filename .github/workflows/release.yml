name: Publicar instaladores

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Encadeado no job do Windows para publicar no mesmo release já criado.
  # Ubuntu 22.04 mantém o AppImage compatível com glibc mais antiga.
  release-linux:
    needs: release-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # fpm precisa do rpmbuild para gerar o pacote .rpm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run dist:linux -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

