name: Publicar instaladores

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Encadeado no job do Windows para publicar no mesmo release já criado.
  # Ubuntu 22.04 mantém o AppImage compatível com glibc mais antiga.
  release-linux:
    needs: release-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # fpm precisa do rpmbuild para gerar o pacote .rpm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run dist:linux -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # O APK Android entra no mesmo release, e é dele que o app se atualiza.
  # Com os secrets do keystore o APK sai assinado; sem eles, sai o de debug
  # (instalável, mas com assinatura diferente a cada build).
  release-android:
    needs: release-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Nome do APK
        run: echo "APK_NAME=Openfy-$(node -p "require('./package.json').version")-android.apk" >> "$GITHUB_ENV"
      - name: Gerar APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:android
          npx cap sync android
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > openfy-release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          else
            echo "::warning::Sem o secret ANDROID_KEYSTORE_BASE64: publicando APK de debug."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"
          fi
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
