name: Publicar APK Android

# Roda junto com a tag da versão e também sob demanda, para anexar (ou refazer)
# o APK de um release que já existe sem reconstruir Windows e Linux.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release que vai receber o APK (ex.: v0.2.0-beta.5)'
        required: true

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # O padrão do action inclui o pacote "tools", que não existe mais no SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'
      - run: npm ci
      - name: Nome do APK
        run: |
          echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
          echo "APK_NAME=Openfy-$(node -p "require('./package.json').version")-android.apk" >> "$GITHUB_ENV"
      - name: Gerar APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:android
          npx cap sync android
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > openfy-release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          else
            echo "::warning::Sem o secret ANDROID_KEYSTORE_BASE64: publicando APK de debug."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"
          fi
      # Na publicação por tag, o release é criado pelo job do Windows: espera ele
      # existir antes de anexar o APK.
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
              exit 0
            fi
            echo "Release $RELEASE_TAG ainda não existe (tentativa $attempt). Aguardando..."
            sleep 20
          done
          echo "::error::Release $RELEASE_TAG não apareceu; rode o workflow de novo depois."
          exit 1
